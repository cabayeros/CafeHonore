<a class="skip-link" href="#contenido" (click)="$event.preventDefault(); content.focus()">Saltar al contenido</a>
<div class="topbar"><div class="shell topbar-inner"><span>.:: Café Honoré ::. | 3.1.53 |</span><a routerLink="/cuenta">Iniciar sesión</a></div></div>
<header class="site-header">
  <div class="shell header-layout">
    <div class="brand-row">
      <a class="plus-brand" routerLink="/inicio" aria-label="+PLUS · Inicio"><img src="assets/img/LogoPlus.png" alt="+PLUS"></a>
      <div class="partner-logos" aria-label="Nuestras marcas">
        <a href="http://www.cafehonore.hn/" target="_blank" rel="noopener noreferrer"><img src="assets/img/sucursales/logoInicioHonore.jpg" alt="Café Honoré"></a>
        <a href="http://marcoaldany.hn/" target="_blank" rel="noopener noreferrer"><img src="assets/img/sucursales/logoInicioAldany.jpg" alt="Marco Aldany"></a>
        <a href="http://floreshonore.hn/" target="_blank" rel="noopener noreferrer"><img src="assets/img/sucursales/logoInicioCanastas.jpg" alt="Flores y Canastas Honoré"></a>
      </div>
    </div>
    <nav class="navigation" aria-label="Navegación principal">
      <div id="main-menu" class="nav-links">
        @for (link of links; track link.path) {
          <a [routerLink]="'/' + link.path" routerLinkActive="active" ariaCurrentWhenActive="page" [attr.aria-label]="link.label" [attr.title]="link.label">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path [attr.d]="link.icon" /></svg>
            <span class="nav-label">{{ link.label }}</span>
          </a>
        }
      </div>
    </nav>
  </div>
</header>
<main id="contenido" class="shell main" tabindex="-1" #content><router-outlet /></main>
<footer class="shell footer"><div><span>© SPlus;</span></div><img src="assets/img/DATACODE.png" alt="Datacode"></footer>
